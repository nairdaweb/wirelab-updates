    type: nodebb-plugin
    channel: stable
    status: released
    visibility: public
    source: npm
    npm: nodebb-plugin-wirelab-shoutbox
    repo: nairdaweb/nodebb-plugin-wirelab-shoutbox

  - id: nodebb-plugin-solved
